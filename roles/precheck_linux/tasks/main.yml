- name: Extract Root Disk Usage
  shell: df -h / --output=pcent | tail -1 | sed 's/%//' | xargs
  register: root_usage_raw
  changed_when: false

- name: Fail if disk usage too high
  ansible.builtin.fail:
    msg: "Disk usage is {{ root_usage_raw.stdout }}%"
  when: root_usage_raw.stdout | int > disk_threshold

- name: Calculate Memory Usage
  shell: free -m | awk '/Mem:/ {printf "%.2f", ($3/$2)*100}'
  register: mem_usage_raw
  changed_when: false

- name: Fail if memory usage too high
  ansible.builtin.fail:
    msg: "Memory usage is {{ mem_usage_raw.stdout }}%"
  when: mem_usage_raw.stdout | float > mem_threshold

- name: Check reboot required
  command: needs-restarting -r
  register: reboot_check
  failed_when: false
  changed_when: false

- name: Debug system status
  debug:
    msg:
      - "Disk: {{ root_usage_raw.stdout }}%"
      - "Memory: {{ mem_usage_raw.stdout }}%"
      - "Reboot required: {{ reboot_check.rc != 0 }}"
