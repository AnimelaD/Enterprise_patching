- name: Linux Postchecks
  when: ansible_os_family != "Windows"
  block:

    - name: Ensure httpd running
      systemd:
        name: httpd
        state: started
      register: svc

    - name: Check port 80
      wait_for:
        port: 80
        timeout: 10

    - name: Fail if service down
      fail:
        msg: "Service validation failed"
      when: svc.status.ActiveState != "active"

- name: Windows Postchecks
  when: ansible_os_family == "Windows"
  block:

    - name: Ensure service running
      win_service:
        name: W32Time
        state: started
      register: win_svc

    - name: Fail if stopped
      fail:
        msg: "Windows service validation failed"
      when: win_svc.state != "running"
