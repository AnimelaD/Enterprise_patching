---
# ===============================
# Windows Precheck Role
# ===============================

- name: PRE-CHECK (WIN) | Calculate C Drive Free Space %
  win_shell: |
    $disk = Get-CimInstance Win32_LogicalDisk -Filter "DeviceID='C:'"
    Write-Output ([Math]::Round(($disk.FreeSpace / $disk.Size) * 100, 2))
  register: disk_free_raw
  changed_when: false

- name: PRE-CHECK (WIN) | Normalize Disk Free %
  set_fact:
    disk_free: >-
      {{
        (
          disk_free_raw.stdout
          | default(disk_free_raw.stdout_lines | default([]) | first | default('0'))
        )
        | trim
        | float
      }}

- name: PRE-CHECK (WIN) | Fail if Disk Space Low
  fail:
    msg: "CRITICAL: Only {{ disk_free }}% space remaining on C:. Threshold is {{ disk_free_threshold }}%"
  when: disk_free | float < disk_free_threshold | float 


# -------------------------------
# MEMORY CHECK
# -------------------------------

- name: PRE-CHECK (WIN) | Calculate Memory Usage %
  win_shell: |
    $os = Get-CimInstance Win32_OperatingSystem
    $pctUsed = (($os.TotalVisibleMemorySize - $os.FreePhysicalMemory) / $os.TotalVisibleMemorySize) * 100
    Write-Output ([Math]::Round($pctUsed, 2))
  register: mem_usage_raw
  changed_when: false

- name: PRE-CHECK (WIN) | Normalize Memory Usage %
  set_fact:
    mem_usage: >-
      {{
        (
          mem_usage_raw.stdout
          | default(mem_usage_raw.stdout_lines | default([]) | first | default('0'))
        )
        | trim
        | float
      }}

- name: PRE-CHECK (WIN) | Fail if Memory Usage High
  fail:
    msg: "CRITICAL: Memory usage is {{ mem_usage }}%. Threshold is {{ mem_used_threshold }}%"
  when: mem_usage | float > mem_used_threshold | float 


# -------------------------------
# REBOOT CHECK
# -------------------------------

- name: PRE-CHECK (WIN) | Check Pending Reboot
  win_shell: |
    $reboot = $false
    if (Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Component Based Servicing\RebootPending" -ErrorAction SilentlyContinue) { $reboot = $true }
    if (Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\WindowsUpdate\Auto Update\RebootRequired" -ErrorAction SilentlyContinue) { $reboot = $true }
    if (Get-ItemProperty "HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager" -Name "PendingFileRenameOperations" -ErrorAction SilentlyContinue) { $reboot = $true }

    if ($reboot) { Write-Output "Reboot Required" } else { Write-Output "No Reboot Needed" }
  register: win_reboot_status
  changed_when: false

- name: PRE-CHECK (WIN) | Normalize Reboot Status
  set_fact:
    reboot_required: >-
      {{
        (
          win_reboot_status.stdout
          | default(win_reboot_status.stdout_lines | default([]) | first | default('No Reboot Needed'))
        )
        | trim
      }}

# -------------------------------
# FINAL SUMMARY
# -------------------------------

- name: PRE-CHECK (WIN) | Final Health Summary
  debug:
    msg:
      - "=========== Windows Health Report ==========="
      - "C: Drive Free      : {{ disk_free }}% (Min: {{ disk_free_threshold }}%)"
      - "Memory Usage       : {{ mem_usage }}% (Max: {{ mem_used_threshold }}%)"
      - "Reboot Status      : {{ reboot_required }}"
      - "============================================"
